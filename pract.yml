---
- name: create the list by passing the variables from extra vars
  hosts: localhost
  vars:
    list_var: []

  tasks:

  - name: convert string into the list
    set_fact:
      list1: "{{ list_var }}"

  - name: Print a list
    debug:
      msg:
      - "list: {{ list1 }}"
      - "length of list is: {{ list1 | length }}"
